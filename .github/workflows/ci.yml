name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run npm validation
        run: npm run validate

      - name: Install PowerShell test modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester, PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path ./Get-ExtensionInfo.ps1 -Severity Warning, Error -EnableExit

      - name: Run Pester
        shell: pwsh
        run: |
          $Config = New-PesterConfiguration
          $Config.Run.Path = './Tests'
          $Config.Run.Exit = $true
          $Config.Output.CIFormat = 'GithubActions'
          $Config.CodeCoverage.Enabled = $true
          $Config.CodeCoverage.Path = './Get-ExtensionInfo.ps1'
          Invoke-Pester -Configuration $Config
